[repo]
pulls.bulk_merge = নির্বাচিতগুলো মার্জ করুন (%d)
pulls.bulk_merge_title = নির্বাচিত পুল রিকোয়েস্ট মার্জ করুন
pulls.bulk_merge_description = পুল রিকোয়েস্টগুলো নিচে দেখানো ক্রমে একটির পর একটি প্রক্রিয়া করা হয়। প্রতিটি মার্জের আগে অনুমতি, শাখা সুরক্ষা, পর্যালোচনা, স্ট্যাটাস পরীক্ষা এবং দ্বন্দ্ব আবার যাচাই করা হয়। প্রক্রিয়া শেষ না হওয়া পর্যন্ত এই পৃষ্ঠাটি খোলা রাখুন।
pulls.bulk_merge_method = মার্জ পদ্ধতি
pulls.bulk_merge_default = প্রতিটি রিপোজিটরির ডিফল্ট মার্জ পদ্ধতি ব্যবহার করুন
pulls.bulk_merge_delete = মার্জের পরে উৎস শাখা মুছে দিন
pulls.bulk_merge_continue = কোনো পুল রিকোয়েস্ট মার্জ করা না গেলে চালিয়ে যান
pulls.bulk_merge_stop_help = ডিফল্টভাবে প্রথম ব্যর্থতায় প্রক্রিয়া থেমে যায়। সম্পন্ন মার্জগুলো রাখা হয়। ফলাফল অজানা হলে প্রক্রিয়া সবসময় থেমে যায়।
pulls.bulk_merge_clear = নির্বাচন পরিষ্কার করুন
pulls.bulk_merge_unavailable = শুধু এমন খোলা পুল রিকোয়েস্ট নির্বাচন করুন যেগুলো মার্জ করার অনুমতি আপনার আছে।
pulls.bulk_merge_waiting = পরীক্ষা করার অপেক্ষায়
pulls.bulk_merge_running = পরীক্ষা ও মার্জ করা হচ্ছে...
pulls.bulk_merge_skipped = মার্জ হয়নি
pulls.bulk_merge_stopped = প্রক্রিয়া থেমে যাওয়ায় প্রক্রিয়াকরণ হয়নি
pulls.bulk_merge_unknown = ফলাফল অজানা। আবার চেষ্টা করার আগে এই পুল রিকোয়েস্ট খুলে এর অবস্থা পরীক্ষা করুন।
pulls.bulk_merge_request_failed = অনুরোধ প্রত্যাখ্যাত হয়েছে। পৃষ্ঠাটি রিফ্রেশ করুন এবং আপনার এখনও মার্জ করার অনুমতি আছে কি না পরীক্ষা করুন।
pulls.bulk_merge_summary = মার্জ হয়েছে: %[1]d। মার্জ হয়নি: %[2]d। প্রক্রিয়াকরণ হয়নি: %[3]d। অজানা: %[4]d।
pulls.bulk_merge_refresh = তালিকা রিফ্রেশ করুন
pulls.bulk_merge_not_ready = এই পুল রিকোয়েস্টটি মার্জ করার জন্য প্রস্তুত নয়: %s
pulls.bulk_merge_target_changed = এই পুল রিকোয়েস্ট নির্বাচনের পর লক্ষ্য শাখাটি বদলেছে। আবার চেষ্টা করার আগে তালিকাটি রিফ্রেশ করুন।
pulls.bulk_merge_not_fast_forward = উৎস ও লক্ষ্য শাখা আলাদা হয়ে যাওয়ায় fast-forward মার্জ সম্ভব নয়।
pulls.bulk_merge_branch_missing = উৎস বা লক্ষ্য শাখা আর বিদ্যমান নেই।
pulls.bulk_merge_follow_up_failed = পুল রিকোয়েস্টটি মার্জ হয়েছে, কিন্তু পরবর্তী একটি অপারেশন ব্যর্থ হয়েছে। অবস্থা পরীক্ষা করতে পুল রিকোয়েস্টটি খুলুন।
pulls.bulk_merge_delete_failed = পুল রিকোয়েস্টটি মার্জ হয়েছে, কিন্তু এর উৎস শাখা মুছে ফেলা যায়নি।
pulls.bulk_merge_branch_retained = অন্য একটি খোলা পুল রিকোয়েস্ট এখনও ব্যবহার করছে বলে উৎস শাখাটি রাখা হয়েছে।

