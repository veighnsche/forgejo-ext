pulls.bulk_merge = אויסקליבענע צונויפֿגיסן (%d)
pulls.bulk_merge_title = צונויפֿגיסן אויסגעקליבענע פּול־בעטן
pulls.bulk_merge_description = פּול־בעטן ווערן פּראַסעסט איינס נאָך איינס אין דער סדר וואָס ווײַזט זיך אונטן. איידער יעדער צונויפֿגיסן ווערן רעכט, בראַנטש־שוץ, איבערקוקן, סטאַטוס־קאָנטראָלן און קאנפליקטן ווידער אָפּגעשטעלט. האַלט דעם בלאַט אָפֿן ביז דער פּראַסעסינג ענדיקט זיך.
pulls.bulk_merge_method = צונויפֿגיס־מעטאָד
pulls.bulk_merge_default = ניצן דעם באַשטימטן צונויפֿגיס־מעטאָד פֿון יעדן רעפּאַזאַטאָרי
pulls.bulk_merge_delete = אויסמעקן מקור־בראַנטשן נאָך צונויפֿגיסן
pulls.bulk_merge_continue = פאָרזעצן ווען אַ פּול־בעט קען נישט צונויפֿגעגיסן ווערן
pulls.bulk_merge_stop_help = בדרך־כלל שטעלט זיך דער פּראַסעסינג אָפּ בײַם ערשטן דורכפֿאַל. פֿאַרטיקע צונויפֿגיסן ווערן געהאַלטן. אויב דער רעזולטאַט איז אומבאַקאַנט, שטעלט זיך דער פּראַסעסינג שטענדיק אָפּ.
pulls.bulk_merge_clear = אויסמעקן אויסקלייב
pulls.bulk_merge_unavailable = אויסקלייבן בלויז אָפֿענע פּול־בעטן וואָס דו האָסט דערלויבעניש צו צונויפֿגיסן.
pulls.bulk_merge_waiting = וואַרט אויף קאָנטראָל
pulls.bulk_merge_running = קאָנטראָלירט און צונויפֿגעגיסן...
pulls.bulk_merge_skipped = נישט צונויפֿגעגיסן
pulls.bulk_merge_stopped = נישט פּראַסעסט, ווײַל דער פּראַסעסינג איז אָפּגעשטעלט געוואָרן
pulls.bulk_merge_unknown = רעזולטאַט אומבאַקאַנט. עפֿן דעם פּול־בעט צו קאָנטראָלירן זײַן סטאַטוס איידער דו פּרובירסט ווידער.
pulls.bulk_merge_request_failed = דער בעט איז אָפּגעוויזן. ריפרעש דעם בלאַט און קאָנטראָליר צי דו האָסט נאָך דערלויבעניש צו צונויפֿגיסן.
pulls.bulk_merge_summary = צונויפֿגעגיסן: %[1]d. נישט צונויפֿגעגיסן: %[2]d. נישט פּראַסעסט: %[3]d. אומבאַקאַנט: %[4]d.
pulls.bulk_merge_refresh = ריפרעש רשימה
pulls.bulk_merge_not_ready = דער פּול־בעט איז נישט גרייט צום צונויפֿגיסן: %s
pulls.bulk_merge_target_changed = דער ציל־בראַנטש האָט זיך געביטן זינט דער פּול־בעט איז אויסגעקליבן געוואָרן. ריפרעש די רשימה איידער דו פּרובירסט ווידער.
pulls.bulk_merge_not_fast_forward = fast-forward צונויפֿגיסן איז נישט מעגלעך, ווײַל מקור־און ציל־בראַנטשן האָבן זיך צעשיידט.
pulls.bulk_merge_branch_missing = דער מקור־אָדער ציל־בראַנטש עקזיסטירט שוין נישט.
pulls.bulk_merge_follow_up_failed = דער פּול־בעט איז צונויפֿגעגיסן געוואָרן, אָבער אַ נאָכפֿאָלגנדיקע אָפּעראַציע איז דורכגעפֿאַלן. עפֿן דעם פּול־בעט צו קאָנטראָלירן זײַן סטאַטוס.
pulls.bulk_merge_delete_failed = דער פּול־בעט איז צונויפֿגעגיסן געוואָרן, אָבער זײַן מקור־בראַנטש האָט מען נישט געקענט אויסמעקן.
pulls.bulk_merge_branch_retained = דער מקור־בראַנטש איז געהאַלטן געוואָרן, ווײַל אַן אַנדער אָפֿענער פּול־בעט ניצט אים נאָך.

