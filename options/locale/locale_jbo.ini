pulls.bulk_merge = Jorne lo se cuxna (%d)
pulls.bulk_merge_title = Jorne lo se cuxna pull request
pulls.bulk_merge_description = lo pull request cu se zukte pa pa, ca lo selcuxa be lo tcini be lo jorne. pu lo jorne, lo se curmi, lo nu se zdani, lo nu se jenai, e lo nu se pagbu cu se kancu. ko catlu ti papri ca lo zukte cu mulno.
pulls.bulk_merge_method = Noljorne
pulls.bulk_merge_default = pilno lo nu lo repositora cu catlu lo noljorne
pulls.bulk_merge_delete = muvdu lo kranu brantu ca lo jorne cu mulno
pulls.bulk_merge_continue = ko muvgau ca lo pull request na se jorne
pulls.bulk_merge_stop_help = ca lo nu se zukte cu flalu, lo nu se jorne cu sisti. lo jorne poi mulno cu stura. ca lo nalmujygu’e cu na se djuno, lo zukte cu sisti.
pulls.bulk_merge_clear = selcuxa vimcu
pulls.bulk_merge_unavailable = ko cuxna lo pull request poi se ganse e poi do ka’e jorne
pulls.bulk_merge_waiting = na’o se cuxna
pulls.bulk_merge_running = ca’o cuxna je jorne...
pulls.bulk_merge_skipped = na se jorne
pulls.bulk_merge_stopped = na se zukte ki’u lo zukte cu sisti
pulls.bulk_merge_unknown = lo nalmujygu’e cu na se djuno. ko catlu lo pull request ti ca lo nu do troci fi lo nu jorne.
pulls.bulk_merge_request_failed = lo cpedu cu se spuda. ko freski lo papri e ko jarco lo nu do pu se curmi lo jorne.
pulls.bulk_merge_summary = jorne: %[1]d. na se jorne: %[2]d. na se zukte: %[3]d. na djuno: %[4]d.
pulls.bulk_merge_refresh = freski lo liste
pulls.bulk_merge_not_ready = lo pull request ti na se mulno lo nu jorne: %s
pulls.bulk_merge_target_changed = lo kranu brantu cu galfi ca lo pull request ti se cuxna. ko freski lo liste ca lo nu do troci fi lo nu jorne.
pulls.bulk_merge_not_fast_forward = lo fast-forward jorne na se ckaji ki’u lo brantu be lo kranu e lo brantu be lo kranu brantu cu se fargau.
pulls.bulk_merge_branch_missing = lo brantu be lo kranu ja lo brantu be lo kranu brantu cu na zasti.
pulls.bulk_merge_follow_up_failed = lo pull request cu se jorne, ku’i lo balvi se zukte cu flalu. ko catlu lo pull request ti lo nu do djuno lo stali.
pulls.bulk_merge_delete_failed = lo pull request cu se jorne, ku’i lo brantu be lo kranu cu na se vimcu.
pulls.bulk_merge_branch_retained = lo brantu be lo kranu cu stura ki’u lo drata pull request poi se ganse cu pilno ri.

