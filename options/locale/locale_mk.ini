pulls.bulk_merge = Спои ги избраните (%d)
pulls.bulk_merge_title = Спои ги избраните барања за повлекување
pulls.bulk_merge_description = Барањата за повлекување се обработуваат едно по едно по редоследот прикажан подолу. Пред секое спојување повторно се проверуваат дозволите, заштитата на гранките, прегледите, проверките на состојбата и конфликтите. Оставете ја оваа страница отворена додека обработката не заврши.
pulls.bulk_merge_method = Метод на спојување
pulls.bulk_merge_default = Користи го стандардниот метод на спојување на секое складиште
pulls.bulk_merge_delete = Избриши ги изворните гранки по спојувањето
pulls.bulk_merge_continue = Продолжи кога барањето не може да се спои
pulls.bulk_merge_stop_help = Стандардно, обработката запира при првиот неуспех. Завршените спојувања се задржуваат. При непознат резултат, обработката секогаш запира.
pulls.bulk_merge_clear = Исчисти го изборот
pulls.bulk_merge_unavailable = Изберете само отворени барања што имате дозвола да ги споите.
pulls.bulk_merge_waiting = Се чека проверка
pulls.bulk_merge_running = Се проверува и спојува...
pulls.bulk_merge_skipped = Не е споено
pulls.bulk_merge_stopped = Не е обработено бидејќи обработката е запрена
pulls.bulk_merge_unknown = Резултатот е непознат. Отворете го ова барање и проверете ја неговата состојба пред повторен обид.
pulls.bulk_merge_request_failed = Барањето е одбиено. Освежете ја страницата и проверете дали сè уште имате дозвола за спојување.
pulls.bulk_merge_summary = Споени: %[1]d. Неспоени: %[2]d. Необработени: %[3]d. Непознати: %[4]d.
pulls.bulk_merge_refresh = Освежи ја листата
pulls.bulk_merge_not_ready = Ова барање не е подготвено за спојување: %s
pulls.bulk_merge_target_changed = Целната гранка е променета откако беше избрано ова барање. Освежете ја листата пред повторен обид.
pulls.bulk_merge_not_fast_forward = Fast-forward спојувањето не е можно бидејќи изворната и целната гранка се разишле.
pulls.bulk_merge_branch_missing = Изворната или целната гранка повеќе не постои.
pulls.bulk_merge_follow_up_failed = Барањето е споено, но следната операција не успеа. Отворете го за да ја проверите состојбата.
pulls.bulk_merge_delete_failed = Барањето е споено, но изворната гранка не можеше да се избрише.
pulls.bulk_merge_branch_retained = Изворната гранка е задржана бидејќи друго отворено барање сè уште ја користи.

