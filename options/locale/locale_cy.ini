pulls.bulk_merge = Cyfuno’r rhai a ddewiswyd (%d)
pulls.bulk_merge_title = Cyfuno ceisiadau tynnu a ddewiswyd
pulls.bulk_merge_description = Caiff ceisiadau tynnu eu prosesu un ar y tro yn y drefn a ddangosir isod. Cyn pob cyfuniad, caiff caniatâd, amddiffyniadau canghennau, adolygiadau, gwiriadau statws a gwrthdaro eu gwirio eto. Cadwch y dudalen hon ar agor nes i’r prosesu orffen.
pulls.bulk_merge_method = Dull cyfuno
pulls.bulk_merge_default = Defnyddio dull cyfuno rhagosodedig pob ystorfa
pulls.bulk_merge_delete = Dileu canghennau ffynhonnell ar ôl cyfuno
pulls.bulk_merge_continue = Parhau pan na ellir cyfuno cais tynnu
pulls.bulk_merge_stop_help = Yn ddiofyn, mae’r prosesu’n stopio ar y methiant cyntaf. Cedwir y cyfuniadau a gwblhawyd. Os nad yw’r canlyniad yn hysbys, mae’r prosesu bob amser yn stopio.
pulls.bulk_merge_clear = Clirio’r dewis
pulls.bulk_merge_unavailable = Dewiswch geisiadau tynnu agored yn unig y mae gennych ganiatâd i’w cyfuno.
pulls.bulk_merge_waiting = Aros i wirio
pulls.bulk_merge_running = Gwirio a chyfuno...
pulls.bulk_merge_skipped = Heb ei gyfuno
pulls.bulk_merge_stopped = Heb ei brosesu am fod y prosesu wedi stopio
pulls.bulk_merge_unknown = Nid yw’r canlyniad yn hysbys. Agorwch y cais tynnu hwn i wirio ei gyflwr cyn ceisio eto.
pulls.bulk_merge_request_failed = Gwrthodwyd y cais. Adnewyddwch y dudalen a gwiriwch fod gennych ganiatâd cyfuno o hyd.
pulls.bulk_merge_summary = Cyfunwyd: %[1]d. Heb eu cyfuno: %[2]d. Heb eu prosesu: %[3]d. Anhysbys: %[4]d.
pulls.bulk_merge_refresh = Adnewyddu’r rhestr
pulls.bulk_merge_not_ready = Nid yw’r cais tynnu hwn yn barod i’w gyfuno: %s
pulls.bulk_merge_target_changed = Mae’r gangen darged wedi newid ers i’r cais tynnu hwn gael ei ddewis. Adnewyddwch y rhestr cyn ceisio eto.
pulls.bulk_merge_not_fast_forward = Nid yw cyfuno fast-forward yn bosibl am fod y canghennau ffynhonnell a tharged wedi ymwahanu.
pulls.bulk_merge_branch_missing = Nid yw’r gangen ffynhonnell na’r gangen darged yn bodoli mwyach.
pulls.bulk_merge_follow_up_failed = Cafodd y cais tynnu ei gyfuno, ond methodd gweithred ddilynol. Agorwch y cais i wirio ei gyflwr.
pulls.bulk_merge_delete_failed = Cafodd y cais ei gyfuno, ond ni ellid dileu ei gangen ffynhonnell.
pulls.bulk_merge_branch_retained = Cadwyd y gangen ffynhonnell am fod cais tynnu agored arall yn ei defnyddio o hyd.

