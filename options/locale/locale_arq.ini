pulls.bulk_merge = دمج المحددة (%d)
pulls.bulk_merge_title = دمج طلبات السحب المحددة
pulls.bulk_merge_description = تتم معالجة طلبات السحب واحدًا تلو الآخر بالترتيب الموضح أدناه. قبل كل دمج، يُعاد التحقق من الصلاحيات وحماية الفروع والمراجعات وفحوصات الحالة والتعارضات. أبقِ هذه الصفحة مفتوحة حتى انتهاء المعالجة.
pulls.bulk_merge_method = طريقة الدمج
pulls.bulk_merge_default = استخدام طريقة الدمج الافتراضية لكل مستودع
pulls.bulk_merge_delete = حذف الفروع المصدر بعد الدمج
pulls.bulk_merge_continue = المتابعة عند تعذر دمج طلب سحب
pulls.bulk_merge_stop_help = تتوقف المعالجة افتراضيًا عند أول فشل. تُحفظ عمليات الدمج المكتملة. إذا كانت النتيجة غير معروفة، تتوقف المعالجة دائمًا.
pulls.bulk_merge_clear = مسح التحديد
pulls.bulk_merge_unavailable = حدّد طلبات السحب المفتوحة التي تملك صلاحية دمجها فقط.
pulls.bulk_merge_waiting = بانتظار التحقق
pulls.bulk_merge_running = جارٍ التحقق والدمج...
pulls.bulk_merge_skipped = لم يُدمج
pulls.bulk_merge_stopped = لم تتم معالجته لأن المعالجة توقفت
pulls.bulk_merge_unknown = النتيجة غير معروفة. افتح طلب السحب هذا للتحقق من حالته قبل المحاولة مجددًا.
pulls.bulk_merge_request_failed = رُفض الطلب. حدّث الصفحة وتحقق من استمرار صلاحيتك للدمج.
pulls.bulk_merge_summary = تم الدمج: %[1]d. لم يُدمج: %[2]d. لم تتم معالجته: %[3]d. غير معروف: %[4]d.
pulls.bulk_merge_refresh = تحديث القائمة
pulls.bulk_merge_not_ready = طلب السحب هذا غير جاهز للدمج: %s
pulls.bulk_merge_target_changed = تغيّر الفرع الهدف منذ تحديد طلب السحب هذا. حدّث القائمة قبل المحاولة مجددًا.
pulls.bulk_merge_not_fast_forward = لا يمكن إجراء دمج fast-forward لأن الفرعين المصدر والهدف قد تباعدا.
pulls.bulk_merge_branch_missing = لم يعد الفرع المصدر أو الهدف موجودًا.
pulls.bulk_merge_follow_up_failed = تم دمج طلب السحب، لكن فشلت عملية لاحقة. افتح طلب السحب للتحقق من حالته.
pulls.bulk_merge_delete_failed = تم دمج طلب السحب، لكن تعذر حذف فرعه المصدر.
pulls.bulk_merge_branch_retained = تم الاحتفاظ بالفرع المصدر لأن طلب سحب مفتوحًا آخر لا يزال يستخدمه.

