[repo]
pulls.bulk_merge = Объединить выбранные (%d)
pulls.bulk_merge_title = Объединить выбранные запросы на слияние
pulls.bulk_merge_description = Запросы на слияние обрабатываются по одному в порядке, показанном ниже. Перед каждым слиянием заново проверяются права доступа, защита веток, проверки, статусы и конфликты. Оставьте эту страницу открытой до завершения обработки.
pulls.bulk_merge_method = Метод слияния
pulls.bulk_merge_default = Использовать метод слияния по умолчанию для каждого репозитория
pulls.bulk_merge_delete = Удалять исходные ветки после слияния
pulls.bulk_merge_continue = Продолжить, если запрос на слияние невозможно объединить
pulls.bulk_merge_stop_help = По умолчанию обработка останавливается при первой ошибке. Завершённые слияния сохраняются. При неизвестном результате обработка всегда останавливается.
pulls.bulk_merge_clear = Очистить выбор
pulls.bulk_merge_unavailable = Выбирайте только открытые запросы на слияние, которые вам разрешено объединять.
pulls.bulk_merge_waiting = Ожидание проверки
pulls.bulk_merge_running = Проверка и слияние...
pulls.bulk_merge_skipped = Не объединён
pulls.bulk_merge_stopped = Не обработан, поскольку обработка остановлена
pulls.bulk_merge_unknown = Результат неизвестен. Откройте этот запрос на слияние, чтобы проверить его состояние перед новой попыткой.
pulls.bulk_merge_request_failed = Запрос отклонён. Обновите страницу и проверьте, что у вас всё ещё есть право на слияние.
pulls.bulk_merge_summary = Объединено: %[1]d. Не объединено: %[2]d. Не обработано: %[3]d. Неизвестно: %[4]d.
pulls.bulk_merge_refresh = Обновить список
pulls.bulk_merge_not_ready = Этот запрос на слияние не готов к объединению: %s
pulls.bulk_merge_target_changed = Целевая ветка изменилась после выбора этого запроса на слияние. Обновите список перед новой попыткой.
pulls.bulk_merge_not_fast_forward = Слияние методом fast-forward невозможно, потому что исходная и целевая ветки разошлись.
pulls.bulk_merge_branch_missing = Исходная или целевая ветка больше не существует.
pulls.bulk_merge_follow_up_failed = Запрос на слияние был объединён, но последующая операция завершилась ошибкой. Откройте запрос, чтобы проверить его состояние.
pulls.bulk_merge_delete_failed = Запрос на слияние был объединён, но исходную ветку не удалось удалить.
pulls.bulk_merge_branch_retained = Исходная ветка сохранена, поскольку другой открытый запрос на слияние всё ещё её использует.

