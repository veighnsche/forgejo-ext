[repo]
pulls.bulk_merge = Fusionner la sélection (%d)
pulls.bulk_merge_title = Fusionner les demandes d’ajout sélectionnées
pulls.bulk_merge_description = Les demandes d’ajout sont traitées une par une, dans l’ordre affiché ci-dessous. Avant chaque fusion, les autorisations, protections de branche, évaluations, contrôles d’état et conflits sont vérifiés à nouveau. Gardez cette page ouverte jusqu’à la fin du traitement.
pulls.bulk_merge_method = Méthode de fusion
pulls.bulk_merge_default = Utiliser la méthode de fusion par défaut de chaque dépôt
pulls.bulk_merge_delete = Supprimer les branches source après la fusion
pulls.bulk_merge_continue = Continuer lorsqu’une demande d’ajout ne peut pas être fusionnée
pulls.bulk_merge_stop_help = Par défaut, le traitement s’arrête au premier échec. Les fusions terminées sont conservées. Si le résultat est inconnu, le traitement s’arrête toujours.
pulls.bulk_merge_clear = Effacer la sélection
pulls.bulk_merge_unavailable = Sélectionnez uniquement les demandes d’ajout ouvertes que vous êtes autorisé⋅e à fusionner.
pulls.bulk_merge_waiting = En attente de vérification
pulls.bulk_merge_running = Vérification et fusion en cours…
pulls.bulk_merge_skipped = Non fusionnée
pulls.bulk_merge_stopped = Non traitée car le traitement a été arrêté
pulls.bulk_merge_unknown = Résultat inconnu. Ouvrez cette demande d’ajout pour vérifier son état avant de réessayer.
pulls.bulk_merge_request_failed = La demande a été rejetée. Actualisez la page et vérifiez que vous avez toujours l’autorisation de fusionner.
pulls.bulk_merge_summary = Fusionnées : %[1]d. Non fusionnées : %[2]d. Non traitées : %[3]d. Inconnues : %[4]d.
pulls.bulk_merge_refresh = Actualiser la liste
pulls.bulk_merge_not_ready = Cette demande d’ajout n’est pas prête à être fusionnée : %s
pulls.bulk_merge_target_changed = La branche cible a changé depuis la sélection de cette demande d’ajout. Actualisez la liste avant de réessayer.
pulls.bulk_merge_not_fast_forward = La fusion en avance rapide est impossible, car les branches source et cible ont divergé.
pulls.bulk_merge_branch_missing = La branche source ou cible n’existe plus.
pulls.bulk_merge_follow_up_failed = La demande d’ajout a été fusionnée, mais une opération de suivi a échoué. Ouvrez-la pour vérifier son état.
pulls.bulk_merge_delete_failed = La demande d’ajout a été fusionnée, mais sa branche source n’a pas pu être supprimée.
pulls.bulk_merge_branch_retained = La branche source a été conservée, car une autre demande d’ajout ouverte l’utilise encore.

