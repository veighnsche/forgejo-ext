pulls.bulk_merge = Spoji odabrane (%d)
pulls.bulk_merge_title = Spoji odabrane pull requestove
pulls.bulk_merge_description = Pull requestovi se obrađuju jedan po jedan, redoslijedom prikazanim u nastavku. Prije svakog spajanja ponovno se provjeravaju dozvole, zaštita grana, recenzije, provjere statusa i sukobi. Ostavite ovu stranicu otvorenom dok obrada ne završi.
pulls.bulk_merge_method = Način spajanja
pulls.bulk_merge_default = Koristi zadani način spajanja svakog repozitorija
pulls.bulk_merge_delete = Izbriši izvorne grane nakon spajanja
pulls.bulk_merge_continue = Nastavi kada se pull request ne može spojiti
pulls.bulk_merge_stop_help = Prema zadanim postavkama obrada se zaustavlja kod prve pogreške. Dovršena spajanja ostaju sačuvana. Kod nepoznatog rezultata obrada se uvijek zaustavlja.
pulls.bulk_merge_clear = Očisti odabir
pulls.bulk_merge_unavailable = Odaberite samo otvorene pull requestove koje smijete spojiti.
pulls.bulk_merge_waiting = Čeka se provjera
pulls.bulk_merge_running = Provjera i spajanje...
pulls.bulk_merge_skipped = Nije spojeno
pulls.bulk_merge_stopped = Nije obrađeno jer je obrada zaustavljena
pulls.bulk_merge_unknown = Rezultat je nepoznat. Otvorite ovaj pull request i provjerite njegovo stanje prije ponovnog pokušaja.
pulls.bulk_merge_request_failed = Zahtjev je odbijen. Osvježite stranicu i provjerite imate li još dopuštenje za spajanje.
pulls.bulk_merge_summary = Spojeno: %[1]d. Nije spojeno: %[2]d. Nije obrađeno: %[3]d. Nepoznato: %[4]d.
pulls.bulk_merge_refresh = Osvježi popis
pulls.bulk_merge_not_ready = Ovaj pull request nije spreman za spajanje: %s
pulls.bulk_merge_target_changed = Ciljna grana promijenila se nakon odabira ovog pull requesta. Osvježite popis prije ponovnog pokušaja.
pulls.bulk_merge_not_fast_forward = Fast-forward spajanje nije moguće jer su se izvorna i ciljna grana razišle.
pulls.bulk_merge_branch_missing = Izvorna ili ciljna grana više ne postoji.
pulls.bulk_merge_follow_up_failed = Pull request je spojen, ali naknadna operacija nije uspjela. Otvorite pull request i provjerite njegovo stanje.
pulls.bulk_merge_delete_failed = Pull request je spojen, ali nije bilo moguće izbrisati njegovu izvornu granu.
pulls.bulk_merge_branch_retained = Izvorna grana je zadržana jer je još koristi drugi otvoreni pull request.

