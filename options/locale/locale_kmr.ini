pulls.bulk_merge = Yênanên hilbijartî bike yek (%d)
pulls.bulk_merge_title = Daxwazên pullê yên hilbijartî bike yek
pulls.bulk_merge_description = Daxwazên pullê yek bi yek, di rêza ku li jêr tê nîşandan de, têne pêvajokirin. Berî her yekbûnê destûr, parastina şaxan, nirxandin, kontrolên rewşê û nakokî dîsa têne kontrolkirin. Vê rûpelê vekirî bihêlin heta pêvajokirin biqede.
pulls.bulk_merge_method = Rêbaza yekbûnê
pulls.bulk_merge_default = Rêbaza yekbûnê ya standard a her depoyê bikar bînin
pulls.bulk_merge_delete = Piştî yekbûnê şaxên çavkaniyê jê bibe
pulls.bulk_merge_continue = Dema ku daxwazek pullê nayê yek kirin, bidomînin
pulls.bulk_merge_stop_help = Di rewşa standard de pêvajokirin di yekem têkçûnê de raweste. Yekbûnên temamkirî tên parastin. Ger encam nenas be, pêvajokirin her tim raweste.
pulls.bulk_merge_clear = Hilbijartinê paqij bike
pulls.bulk_merge_unavailable = Tenê daxwazên pullê yên vekirî hilbijêrin ku destûra yekbûnê ya wan heye.
pulls.bulk_merge_waiting = Li benda kontrolê ye
pulls.bulk_merge_running = Tê kontrolkirin û tê yek kirin...
pulls.bulk_merge_skipped = Nehat yek kirin
pulls.bulk_merge_stopped = Nehat pêvajokirin ji ber ku pêvajokirin rawestiya
pulls.bulk_merge_unknown = Encam nenas e. Berî ku dîsa biceribînin vê daxwaza pullê vekin û rewşa wê kontrol bikin.
pulls.bulk_merge_request_failed = Daxwaz hat redkirin. Rûpelê nû bikin û kontrol bikin ka hîn destûra yekbûnê heye.
pulls.bulk_merge_summary = Yek kirî: %[1]d. Ne yek kirî: %[2]d. Ne pêvajokirî: %[3]d. Nenas: %[4]d.
pulls.bulk_merge_refresh = Lîsteyê nû bike
pulls.bulk_merge_not_ready = Ev daxwaza pullê ji bo yekbûnê amade nîne: %s
pulls.bulk_merge_target_changed = Şaxa armancê ji dema hilbijartina vê daxwazê ve guherî. Berî ceribandina dîsa lîsteyê nû bikin.
