pulls.bulk_merge_branch_missing = Şaxa çavkaniyê an armancê êdî tune ye.
pulls.bulk_merge_follow_up_failed = Daxwaza pullê hat yek kirin, lê karê paşê têk çû. Daxwazê vekin da ku rewşê kontrol bikin.
pulls.bulk_merge_delete_failed = Daxwaza pullê hat yek kirin, lê şaxa çavkaniyê nehat jêbirin.
pulls.bulk_merge_branch_retained = Şaxa çavkaniyê hate parastin ji ber ku daxwazeke din a pullê ya vekirî hîn jî wê bikar tîne.

