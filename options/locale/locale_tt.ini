pulls.bulk_merge = Сайланганнарны берләштерү (%d)
pulls.bulk_merge_title = Сайланган pull сорауларын берләштерү
pulls.bulk_merge_description = Pull сораулары түбәндә күрсәтелгән тәртиптә берәм-берәм эшкәртелә. Һәр берләштерү алдыннан рөхсәтләр, ботакларны саклау, тикшерүләр, статус тикшерүләре һәм конфликтлар яңадан тикшерелә. Эшкәртү тәмамланганчы бу битне ачык калдырыгыз.
pulls.bulk_merge_method = Берләштерү ысулы
pulls.bulk_merge_default = Һәр репозиторийның килешү буенча берләштерү ысулын куллану
pulls.bulk_merge_delete = Берләштергәннән соң чыганак ботакларын бетерү
pulls.bulk_merge_continue = Pull соравын берләштереп булмаганда дәвам итү
pulls.bulk_merge_stop_help = Килешү буенча эшкәртү беренче хатада туктый. Тәмамланган берләштерүләр саклана. Нәтиҗә билгесез булса, эшкәртү һәрвакыт туктый.
pulls.bulk_merge_clear = Сайлауны чистарту
pulls.bulk_merge_unavailable = Берләштерергә рөхсәтегез булган ачык pull сорауларын гына сайлагыз.
pulls.bulk_merge_waiting = Тикшерү көтелә
pulls.bulk_merge_running = Тикшерелә һәм берләштерелә...
pulls.bulk_merge_skipped = Берләштерелмәде
pulls.bulk_merge_stopped = Эшкәртелмәде, чөнки эшкәртү туктатылды
pulls.bulk_merge_unknown = Нәтиҗә билгесез. Кабат сынап караганчы бу pull соравын ачып, хәлен тикшерегез.
pulls.bulk_merge_request_failed = Сорау кире кагылды. Битне яңартып, әле дә берләштерү рөхсәтегез барлыгын тикшерегез.
pulls.bulk_merge_summary = Берләштерелде: %[1]d. Берләштерелмәде: %[2]d. Эшкәртелмәде: %[3]d. Билгесез: %[4]d.
pulls.bulk_merge_refresh = Исемлекне яңарту
pulls.bulk_merge_not_ready = Бу pull соравы берләштерергә әзер түгел: %s
pulls.bulk_merge_target_changed = Бу pull соравы сайланганнан соң максат ботагы үзгәрде. Кабат сынаганчы исемлекне яңартыгыз.
pulls.bulk_merge_not_fast_forward = Чыганак һәм максат ботаклары аерылганга fast-forward берләштерү мөмкин түгел.
pulls.bulk_merge_branch_missing = Чыганак яки максат ботагы бүтән юк.
pulls.bulk_merge_follow_up_failed = Pull соравы берләштерелде, ләкин аннан соңгы операция уңышсыз булды. Хәлне тикшерү өчен pull соравын ачыгыз.
pulls.bulk_merge_delete_failed = Pull соравы берләштерелде, ләкин чыганак ботагын бетереп булмады.
pulls.bulk_merge_branch_retained = Чыганак ботагы сакланды, чөнки башка ачык pull соравы аны әле дә куллана.

