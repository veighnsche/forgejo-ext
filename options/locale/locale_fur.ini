[repo]
pulls.bulk_merge = Unisci selezionati (%d)
pulls.bulk_merge_title = Unisci le richieste pull selezionate
pulls.bulk_merge_description = Le richieste pull vengono elaborate una alla volta, nell’ordine mostrato di seguito. Prima di ogni unione vengono verificati nuovamente permessi, protezioni dei rami, revisioni, controlli di stato e conflitti. Mantieni aperta questa pagina fino al termine dell’elaborazione.
pulls.bulk_merge_method = Metodo di unione
pulls.bulk_merge_default = Usa il metodo di unione predefinito di ogni repository
pulls.bulk_merge_delete = Elimina i rami sorgente dopo l’unione
pulls.bulk_merge_continue = Continua quando una richiesta pull non può essere unita
pulls.bulk_merge_stop_help = Per impostazione predefinita, l’elaborazione si interrompe al primo errore. Le unioni completate vengono mantenute. Se il risultato è sconosciuto, l’elaborazione si interrompe sempre.
pulls.bulk_merge_clear = Cancella selezione
pulls.bulk_merge_unavailable = Seleziona solo richieste pull aperte che hai il permesso di unire.
pulls.bulk_merge_waiting = In attesa del controllo
pulls.bulk_merge_running = Controllo e unione in corso...
pulls.bulk_merge_skipped = Non unita
pulls.bulk_merge_stopped = Non elaborata perché l’elaborazione è stata interrotta
pulls.bulk_merge_unknown = Risultato sconosciuto. Apri questa richiesta pull per verificarne lo stato prima di riprovare.
pulls.bulk_merge_request_failed = La richiesta è stata rifiutata. Aggiorna la pagina e verifica di avere ancora il permesso di unire.
pulls.bulk_merge_summary = Unite: %[1]d. Non unite: %[2]d. Non elaborate: %[3]d. Sconosciute: %[4]d.
pulls.bulk_merge_refresh = Aggiorna elenco
pulls.bulk_merge_not_ready = Questa richiesta pull non è pronta per essere unita: %s
pulls.bulk_merge_target_changed = Il ramo di destinazione è cambiato da quando questa richiesta pull è stata selezionata. Aggiorna l’elenco prima di riprovare.
pulls.bulk_merge_not_fast_forward = L’unione fast-forward non è possibile perché i rami sorgente e di destinazione sono divergenti.
pulls.bulk_merge_branch_missing = Il ramo sorgente o di destinazione non esiste più.
pulls.bulk_merge_follow_up_failed = La richiesta pull è stata unita, ma un’operazione successiva non è riuscita. Apri la richiesta pull per verificarne lo stato.
pulls.bulk_merge_delete_failed = La richiesta pull è stata unita, ma non è stato possibile eliminare il ramo sorgente.
pulls.bulk_merge_branch_retained = Il ramo sorgente è stato conservato perché un’altra richiesta pull aperta lo utilizza ancora.

