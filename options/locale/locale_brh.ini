[repo]
pulls.bulk_merge = ادغام موارد انتخاب‌شده (%d)
pulls.bulk_merge_title = ادغام درخواست‌های pull انتخاب‌شده
pulls.bulk_merge_description = درخواست‌های pull به‌صورت یکی‌یکی و به ترتیب نمایش‌داده‌شده در زیر پردازش می‌شوند. پیش از هر ادغام، مجوزها، محافظت شاخه‌ها، بررسی‌ها، بررسی‌های وضعیت و تعارض‌ها دوباره بررسی می‌شوند. این صفحه را تا پایان پردازش باز نگه دارید.
pulls.bulk_merge_method = روش ادغام
pulls.bulk_merge_default = استفاده از روش ادغام پیش‌فرض هر مخزن
pulls.bulk_merge_delete = حذف شاخه‌های مبدأ پس از ادغام
pulls.bulk_merge_continue = ادامه دادن وقتی یک درخواست pull قابل ادغام نیست
pulls.bulk_merge_stop_help = به‌طور پیش‌فرض، پردازش با اولین شکست متوقف می‌شود. ادغام‌های کامل‌شده حفظ می‌شوند. اگر نتیجه نامشخص باشد، پردازش همیشه متوقف می‌شود.
pulls.bulk_merge_clear = پاک کردن انتخاب
pulls.bulk_merge_unavailable = فقط درخواست‌های pull باز را که مجوز ادغامشان را دارید انتخاب کنید.
pulls.bulk_merge_waiting = در انتظار بررسی
pulls.bulk_merge_running = در حال بررسی و ادغام...
pulls.bulk_merge_skipped = ادغام نشد
pulls.bulk_merge_stopped = پردازش نشد چون پردازش متوقف شد
pulls.bulk_merge_unknown = نتیجه نامشخص است. پیش از تلاش دوباره این درخواست pull را باز کنید و وضعیتش را بررسی کنید.
pulls.bulk_merge_request_failed = درخواست رد شد. صفحه را تازه کنید و بررسی کنید که هنوز مجوز ادغام دارید.
pulls.bulk_merge_summary = ادغام‌شده: %[1]d. ادغام‌نشده: %[2]d. پردازش‌نشده: %[3]d. نامشخص: %[4]d.
pulls.bulk_merge_refresh = تازه‌سازی فهرست
pulls.bulk_merge_not_ready = این درخواست pull برای ادغام آماده نیست: %s
pulls.bulk_merge_target_changed = شاخه هدف از زمان انتخاب این درخواست pull تغییر کرده است. پیش از تلاش دوباره فهرست را تازه کنید.
pulls.bulk_merge_not_fast_forward = ادغام fast-forward ممکن نیست، چون شاخه‌های مبدأ و هدف از هم واگرا شده‌اند.
pulls.bulk_merge_branch_missing = شاخه مبدأ یا هدف دیگر وجود ندارد.
pulls.bulk_merge_follow_up_failed = درخواست pull ادغام شد، اما عملیات بعدی شکست خورد. برای بررسی وضعیت، درخواست pull را باز کنید.
pulls.bulk_merge_delete_failed = درخواست pull ادغام شد، اما شاخه مبدأ آن حذف نشد.
pulls.bulk_merge_branch_retained = شاخه مبدأ نگه داشته شد، زیرا یک درخواست pull باز دیگر هنوز از آن استفاده می‌کند.
