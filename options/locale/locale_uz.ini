pulls.bulk_merge = Tanlanganlarni birlashtirish (%d)
pulls.bulk_merge_title = Tanlangan pull so‘rovlarini birlashtirish
pulls.bulk_merge_description = Pull so‘rovlari quyida ko‘rsatilgan tartibda birma-bir qayta ishlanadi. Har bir birlashtirishdan oldin ruxsatlar, tarmoq himoyasi, ko‘rib chiqishlar, holat tekshiruvlari va ziddiyatlar qayta tekshiriladi. Jarayon tugaguncha bu sahifani ochiq qoldiring.
pulls.bulk_merge_method = Birlashtirish usuli
pulls.bulk_merge_default = Har bir repozitoriyning standart birlashtirish usulidan foydalanish
pulls.bulk_merge_delete = Birlashtirgandan so‘ng manba tarmoqlarini o‘chirish
pulls.bulk_merge_continue = Pull so‘rovini birlashtirib bo‘lmaganda davom etish
pulls.bulk_merge_stop_help = Odatiy holatda jarayon birinchi xatoda to‘xtaydi. Tugallangan birlashtirishlar saqlanadi. Natija noma’lum bo‘lsa, jarayon har doim to‘xtaydi.
pulls.bulk_merge_clear = Tanlovni tozalash
pulls.bulk_merge_unavailable = Faqat birlashtirishga ruxsatingiz bor ochiq pull so‘rovlarini tanlang.
pulls.bulk_merge_waiting = Tekshiruv kutilmoqda
pulls.bulk_merge_running = Tekshirilmoqda va birlashtirilmoqda...
pulls.bulk_merge_skipped = Birlashtirilmadi
pulls.bulk_merge_stopped = Jarayon to‘xtatilgani uchun qayta ishlanmadi
pulls.bulk_merge_unknown = Natija noma’lum. Qayta urinishdan oldin holatini tekshirish uchun ushbu pull so‘rovini oching.
pulls.bulk_merge_request_failed = So‘rov rad etildi. Sahifani yangilang va hali ham birlashtirish huquqiga ega ekaningizni tekshiring.
pulls.bulk_merge_summary = Birlashtirildi: %[1]d. Birlashtirilmadi: %[2]d. Qayta ishlanmadi: %[3]d. Noma’lum: %[4]d.
pulls.bulk_merge_refresh = Ro‘yxatni yangilash
pulls.bulk_merge_not_ready = Bu pull so‘rovi birlashtirishga tayyor emas: %s
pulls.bulk_merge_target_changed = Ushbu pull so‘rovi tanlanganidan beri maqsad tarmog‘i o‘zgardi. Qayta urinishdan oldin ro‘yxatni yangilang.
pulls.bulk_merge_not_fast_forward = Manba va maqsad tarmoqlari ajralib ketgani sababli fast-forward birlashtirish mumkin emas.
pulls.bulk_merge_branch_missing = Manba yoki maqsad tarmog‘i endi mavjud emas.
pulls.bulk_merge_follow_up_failed = Pull so‘rovi birlashtirildi, ammo keyingi amal bajarilmadi. Holatini tekshirish uchun pull so‘rovini oching.
pulls.bulk_merge_delete_failed = Pull so‘rovi birlashtirildi, ammo uning manba tarmog‘ini o‘chirib bo‘lmadi.
pulls.bulk_merge_branch_retained = Boshqa ochiq pull so‘rovi undan foydalanayotgani sababli manba tarmog‘i saqlab qolindi.

