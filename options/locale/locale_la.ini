pulls.bulk_merge_title = Iungere petitiones extractionis selectas
pulls.bulk_merge_description = Petitiones extractionis singillatim tractantur ordine infra ostenso. Ante quamque iunctionem potestates, protectiones ramorum, recognitiones, probationes status et conflictus denuo examinantur. Hanc paginam apertam tene donec tractatio finita sit.
pulls.bulk_merge_method = Modus iunctionis
pulls.bulk_merge_default = Utere modo iunctionis praedefinito cuiusque repositorii
pulls.bulk_merge_delete = Ramos fontis post iunctionem dele
pulls.bulk_merge_continue = Perge cum petitio extractionis iungi non potest
pulls.bulk_merge_stop_help = Defalta tractatio primo defectu sistitur. Iunctiones perfectae servantur. Si eventus ignotus est, tractatio semper sistitur.
pulls.bulk_merge_clear = Selectionem vacua fac
pulls.bulk_merge_unavailable = Solas petitiones extractionis apertas elige quas iungere licet.
pulls.bulk_merge_waiting = Exspectat probationem
pulls.bulk_merge_running = Reperit et iungit...
pulls.bulk_merge_skipped = Non iuncta
pulls.bulk_merge_stopped = Non tractata quia tractatio stitit
pulls.bulk_merge_unknown = Eventus ignotus est. Aperi hanc petitionem extractionis ut statum eius ante novum conatum examines.
pulls.bulk_merge_request_failed = Petitio reiecta est. Paginam renova et verifica te adhuc potestatem iungendi habere.
pulls.bulk_merge_summary = Iunctae: %[1]d. Non iunctae: %[2]d. Non tractatae: %[3]d. Ignotae: %[4]d.
pulls.bulk_merge_refresh = Indicem renova
pulls.bulk_merge_not_ready = Haec petitio extractionis ad iungendum parata non est: %s
pulls.bulk_merge_target_changed = Ramus destinatus mutatus est ex quo haec petitio extractionis electa est. Indicem renova antequam iterum coneris.
pulls.bulk_merge_not_fast_forward = Iunctio fast-forward fieri non potest quia rami fontis et destinationis discrepaverunt.
pulls.bulk_merge_branch_missing = Ramus fontis vel destinationis iam non exstat.
pulls.bulk_merge_follow_up_failed = Petitio extractionis iuncta est, sed operatio subsequens defecit. Aperi petitionem ut statum eius examines.
pulls.bulk_merge_delete_failed = Petitio extractionis iuncta est, sed ramus fontis deleri non potuit.
pulls.bulk_merge_branch_retained = Ramus fontis servatus est quia alia petitio extractionis aperta eo adhuc utitur.

