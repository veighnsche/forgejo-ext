pulls.bulk_merge = Seçilmişləri birləşdir (%d)
pulls.bulk_merge_title = Seçilmiş pull sorğularını birləşdir
pulls.bulk_merge_description = Pull sorğuları aşağıda göstərilən ardıcıllıqla bir-bir işlənir. Hər birləşdirmədən əvvəl icazələr, budaq mühafizəsi, rəylər, status yoxlamaları və konfliktlər yenidən yoxlanılır. Emal tamamlanana qədər bu səhifəni açıq saxlayın.
pulls.bulk_merge_method = Birləşdirmə üsulu
pulls.bulk_merge_default = Hər repozitorinin standart birləşdirmə üsulundan istifadə et
pulls.bulk_merge_delete = Birləşdirmədən sonra mənbə budaqlarını sil
pulls.bulk_merge_continue = Pull sorğusu birləşdirilə bilmədikdə davam et
pulls.bulk_merge_stop_help = Varsayılan olaraq emal ilk uğursuzluqda dayanır. Tamamlanmış birləşdirmələr saxlanılır. Nəticə naməlumdursa, emal həmişə dayanır.
pulls.bulk_merge_clear = Seçimi təmizlə
pulls.bulk_merge_unavailable = Yalnız birləşdirmək icazəniz olan açıq pull sorğularını seçin.
pulls.bulk_merge_waiting = Yoxlama gözlənilir
pulls.bulk_merge_running = Yoxlanılır və birləşdirilir...
pulls.bulk_merge_skipped = Birləşdirilmədi
pulls.bulk_merge_stopped = Emal dayandırıldığı üçün işlənmədi
pulls.bulk_merge_unknown = Nəticə naməlumdur. Yenidən cəhd etməzdən əvvəl vəziyyətini yoxlamaq üçün bu pull sorğusunu açın.
pulls.bulk_merge_request_failed = Sorğu rədd edildi. Səhifəni yeniləyin və hələ də birləşdirmək icazəniz olduğunu yoxlayın.
pulls.bulk_merge_summary = Birləşdirildi: %[1]d. Birləşdirilmədi: %[2]d. İşlənmədi: %[3]d. Naməlum: %[4]d.
pulls.bulk_merge_refresh = Siyahını yenilə
pulls.bulk_merge_not_ready = Bu pull sorğusu birləşdirməyə hazır deyil: %s
pulls.bulk_merge_target_changed = Bu pull sorğusu seçildikdən sonra hədəf budaq dəyişib. Yenidən cəhd etməzdən əvvəl siyahını yeniləyin.
pulls.bulk_merge_not_fast_forward = Mənbə və hədəf budaqlar ayrıldığı üçün fast-forward birləşdirməsi mümkün deyil.
pulls.bulk_merge_branch_missing = Mənbə və ya hədəf budaq artıq mövcud deyil.
pulls.bulk_merge_follow_up_failed = Pull sorğusu birləşdirildi, lakin sonrakı əməliyyat uğursuz oldu. Vəziyyətini yoxlamaq üçün pull sorğusunu açın.
pulls.bulk_merge_delete_failed = Pull sorğusu birləşdirildi, lakin mənbə budağı silinə bilmədi.
pulls.bulk_merge_branch_retained = Mənbə budaq saxlanıldı, çünki başqa açıq pull sorğusu hələ də ondan istifadə edir.

