; Forgejo instance configuration template for LOCAL FEDERATION TESTING.
;
; Copy this to /path/to/nodeX/conf/app.ini and adjust the three occurrences
; of "NODE_NAME"/port numbers so each instance is unique.
;
; For production federation, keep INSECURE_ALLOW_INVALID_HOSTS = false and use
; real, TLS-terminated domains for ROOT_URL.

APP_NAME = Forgejo Node A
APP_SLOGAN = Beyond coding. We Forge.
RUN_MODE = dev
RUN_USER = deva

[database]
DB_TYPE = sqlite3
PATH = /path/to/nodeA/data/forgejo.db
SQLITE_JOURNAL_MODE = MEMORY

[repository]
ROOT = /path/to/nodeA/repos
DEFAULT_PRIVATE = private

[repository.signing]
SIGNING_KEY = none

[server]
SSH_DOMAIN = localhost
HTTP_PORT = 3001
ROOT_URL = http://localhost:3001/
DISABLE_SSH = false
SSH_LISTEN_HOST = localhost
SSH_PORT = 2201
START_SSH_SERVER = true
LFS_START_SERVER = true
OFFLINE_MODE = false
LFS_JWT_SECRET = <generate a unique random secret per node>
APP_DATA_PATH = /path/to/nodeA/data
ENABLE_GZIP = true
DOMAIN = localhost

[service]
REGISTER_EMAIL_CONFIRM = false
REGISTER_MANUAL_CONFIRM = false
ENABLE_NOTIFY_MAIL = true
DISABLE_REGISTRATION = false
ENABLE_CAPTCHA = false
REQUIRE_SIGNIN_VIEW = false
DEFAULT_KEEP_EMAIL_PRIVATE = false
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
NO_REPLY_ADDRESS = noreply.localhost

[picture]
DISABLE_GRAVATAR = false
ENABLE_FEDERATED_AVATAR = false
AVATAR_UPLOAD_PATH = /path/to/nodeA/data/avatars

[session]
PROVIDER = file
PROVIDER_CONFIG = /path/to/nodeA/data/sessions

[log]
MODE = console
LEVEL = Info

[security]
PASSWORD_HASH_ALGO = argon2
DISABLE_GIT_HOOKS = false
INSTALL_LOCK = true
SECRET_KEY = <generate a unique random secret per node>
INTERNAL_TOKEN = <generate a unique random JWT per node>
DISABLE_QUERY_AUTH_TOKEN = true

[oauth2]
JWT_SECRET = <generate a unique random secret per node>

[federation]
ENABLED = true
; REQUIRED for local testing (loopback + private IPs). Disable in production.
INSECURE_ALLOW_INVALID_HOSTS = true