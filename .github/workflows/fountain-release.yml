name: Fountain release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact Fountain tag to publish (v15.0.10-fountain.1), or the prospective tag for a dry run
        required: true
        type: string
      dry_run:
        description: Validate only (source gates, build once, test image); publish nothing and require no tag
        required: false
        default: false
        type: boolean

permissions:
  contents: read
concurrency:
  group: fountain-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: fountain-release
    permissions:
      contents: write
      packages: write
    env:
      OUT: /home/runner/fountain-release
      TMPDIR: /home/runner/fountain-tmp
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve exact release tag
        id: release
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$TMPDIR"
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-fountain\.[1-9][0-9]*$ ]]
          if [[ '${{ inputs.dry_run }}' == true ]]; then
            # Validation only: the tag names the attempt but need not exist.
            commit=$GITHUB_SHA
          else
            commit=$(git rev-parse "refs/tags/$TAG^{commit}")
          fi
          repo=$(gh api "repos/$GITHUB_REPOSITORY")
          jq -e '.private == false' <<< "$repo"
          # Reuse caches on a stable maintained branch across release tags.
          [[ $GITHUB_REF == refs/heads/* ]]
          # Release the reviewed workflow implementation, never load scripts
          # from an unrelated dispatch branch or a moving ref.
          [[ $commit == "$GITHUB_SHA" ]]
          git checkout --detach "$commit"
          if [[ '${{ inputs.dry_run }}' != true ]] && gh release view "$TAG" >/dev/null 2>&1; then
            echo 'Release already exists; choose a new version.' >&2
            exit 1
          fi
          # Check version availability before source checks or compilation.
          # A never-created GHCR package can return "denied" from the registry;
          # its owner's package API distinguishes absence from other errors.
          owner_type=$(jq -r '.owner.type' <<< "$repo")
          package_owner="users/$GITHUB_REPOSITORY_OWNER"
          if [[ $owner_type == Organization ]]; then package_owner="orgs/$GITHUB_REPOSITORY_OWNER"; fi
          if gh api --paginate "$package_owner/packages/container/fountain/versions" --jq '.[].metadata.container.tags[]' \
              > "$TMPDIR/existing-tags.txt" 2> "$TMPDIR/package-error.txt"; then
            if grep -Fx "${TAG#v}" "$TMPDIR/existing-tags.txt"; then
              echo 'Image tag already exists; choose a new version.' >&2
              exit 1
            fi
          else
            grep -F '(HTTP 404)' "$TMPDIR/package-error.txt"
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fountain" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/fountain-setup
        with:
          dependencies: 'false'
      - uses: docker/setup-buildx-action@v4
        id: buildx
      - name: Expose GitHub build cache
        uses: crazy-max/ghaction-github-runtime@v4
      - name: Restore native compiler and module caches
        uses: actions/cache@v5
        id: mounts
        with:
          path: /home/runner/fountain-buildkit-cache
          key: fountain-buildkit-amd64-${{ hashFiles('Dockerfile', 'go.sum', 'sdk/go.sum') }}-${{ steps.release.outputs.commit }}
          restore-keys: |
            fountain-buildkit-amd64-${{ hashFiles('Dockerfile', 'go.sum', 'sdk/go.sum') }}-
      - name: Inject and save BuildKit cache mounts
        uses: reproducible-containers/buildkit-cache-dance@v3
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-dir: /home/runner/fountain-buildkit-cache
          # Keep action scratch outside the release checkout: the producer
          # refuses any uncommitted checkout content before building.
          scratch-dir: /home/runner/fountain-scratch
          dockerfile: Dockerfile
          skip-extraction: ${{ steps.mounts.outputs.cache-hit }}
      - name: Source gates, build once, test image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
        run: bash tools/fountain-release.sh "$VERSION" "$COMMIT" "$OUT"
      - name: Login to GHCR
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish the validated image and release assets
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          COMMIT: ${{ steps.release.outputs.commit }}
          IMAGE: ${{ steps.release.outputs.image }}
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          config=$(cat "$OUT/image-id")
          docker tag "$config" "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          reference=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$VERSION")
          [[ $reference == "$IMAGE@sha256:"* ]]
          digest=${reference#*@}
          # Bind the registry manifest to the exact configuration tested locally.
          docker buildx imagetools inspect --raw "$reference" | jq -e --arg config "$config" '.config.digest == $config'
          bash tools/fountain-release-metadata.sh "$OUT" "$VERSION" "$COMMIT" "$IMAGE" "$digest"
          printf 'Fountain %s\n\nSource: %s\nImage: `%s`\n\nSee docs/fountain-release.md in the source archive for the runtime and extension contract.\n' \
            "$VERSION" "$COMMIT" "$reference" > "$OUT/release-notes.txt"
          gh release create "$TAG" --verify-tag --draft --title "Fountain $VERSION" --notes-file "$OUT/release-notes.txt" \
            "$OUT/fountain-$VERSION-source.tar.gz" "$OUT/fountain-$VERSION-linux-amd64.gz" \
            "$OUT/forgejo-src-$VERSION+gitea-1.22.0.tar.gz" \
            "$OUT/LICENSE" "$OUT/SHA256SUMS" "$OUT/release.json"
          gh release edit "$TAG" --draft=false --latest=false
